<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="stylesheet" href="/styles.css" />
		<title>Pi Canvas</title>
	</head>
	<body>
		<header id="status" data-canvas-slot="status" aria-live="polite"></header>
		<main id="root" data-canvas-slot="root">
			<section id="canvas-empty-state">
				<p class="empty-kicker">Pi Canvas</p>
				<h1>A shared surface for working things out.</h1>
				<p class="muted">
					Canvas is a temporary work surface beside Pi chat. Ask the agent to sketch a spec, walk through a diff, or
					lay out options here — then steer it with the controls it renders.
				</p>
			</section>
		</main>
		<aside id="sidebar" data-canvas-slot="sidebar"></aside>
		<script src="/components.js" defer></script>
		<script src="/client.js" defer></script>
	</body>
</html>
